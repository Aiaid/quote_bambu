name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or compatibility gap should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Relevant printer models or Quote/0 mode
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
